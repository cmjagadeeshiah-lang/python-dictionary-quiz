<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Dictionary Comprehension Quiz</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
  color:#fff; display:flex; align-items:center; justify-content:center; padding:24px;
}
.container{width:min(760px,100%)}
header{text-align:center;margin-bottom:22px}
.logo{font-size:48px}
h1{margin:5px 0;font-size:clamp(28px,5vw,42px)}
.subtitle{color:#cbd5e1;margin:8px 0}
.card{
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px); border-radius:24px; padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.3)
}
.top{display:flex;justify-content:space-between;gap:15px;color:#cbd5e1;font-weight:600}
.progress{height:9px;background:rgba(255,255,255,.15);border-radius:99px;margin:16px 0 28px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:#a78bfa;transition:.35s}
.question{font-size:21px;line-height:1.5;margin-bottom:20px;white-space:pre-line}
.options{display:grid;gap:12px}
.option{
  width:100%; padding:16px 18px; border-radius:14px;
  border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.08);
  color:white;text-align:left;font-size:16px;cursor:pointer;transition:.2s
}
.option:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.option.correct{background:rgba(34,197,94,.25);border-color:#4ade80}
.option.wrong{background:rgba(239,68,68,.25);border-color:#f87171}
.option:disabled{cursor:default}
.feedback{min-height:28px;margin:18px 0;font-weight:700}
button.next,.restart{
  border:0;border-radius:13px;padding:13px 22px;background:#8b5cf6;color:white;
  font-size:16px;font-weight:700;cursor:pointer
}
.next{display:none;margin-left:auto}
.result{text-align:center}
.score{font-size:56px;font-weight:800;margin:12px}
.badge{font-size:22px;margin-bottom:22px}
.small{color:#cbd5e1}
.hidden{display:none}
.review{text-align:left;margin-top:25px}
.review-item{padding:13px;border-radius:12px;background:rgba(255,255,255,.07);margin:9px 0}
footer{text-align:center;color:#94a3b8;font-size:13px;margin-top:18px}
@media(max-width:520px){.card{padding:20px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">🐍</div>
  <h1>Python Dictionary Comprehension Quiz</h1>
  <p class="subtitle">Test your Python skills with 10 interactive questions.</p>
</header>

<div class="card" id="quizCard">
  <div class="top">
    <span id="questionNumber">Question 1 of 10</span>
    <span id="score">Score: 0</span>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="nextBtn">Next Question →</button>
</div>

<div class="card result hidden" id="resultCard">
  <div style="font-size:58px">🏆</div>
  <h2>Quiz Completed!</h2>
  <div class="score" id="finalScore">0/10</div>
  <div class="badge" id="finalMessage"></div>
  <p class="small" id="percentage"></p>
  <div class="review" id="review"></div>
  <br>
  <button class="restart" onclick="restartQuiz()">🔄 Try Again</button>
</div>
<footer>Practice Python • Learn by doing</footer>
</div>

<script>
const questions = [
 {q:"Which symbol is used to create a dictionary comprehension?",
  o:["A. []","B. {}","C. ()","D. <>"],a:1,e:"Dictionary comprehensions use curly braces: {}."},
 {q:"What is the output of: {x: x*x for x in range(1, 4)}?",
  o:["A. {1: 1, 2: 4, 3: 9}","B. {1, 2, 4, 3, 9}","C. {1: 2, 2: 4, 3: 6}","D. {0: 0, 1: 1, 2: 4}"],a:0,e:"Each number becomes a key and its square becomes the value."},
 {q:"Which of the following is a valid dictionary comprehension?",
  o:["A. [x: x*x for x in range(5)]","B. {x: x*x for x in range(5)}","C. (x: x*x for x in range(5))","D. <x: x*x for x in range(5)>"],a:1,e:"The general form is {key: value for item in iterable}."},
 {q:"What is the output of: {x: x+10 for x in range(3)}?",
  o:["A. {0: 10, 1: 11, 2: 12}","B. {10: 0, 11: 1, 12: 2}","C. {0, 1, 2, 10}","D. {10, 11, 12}"],a:0,e:"range(3) gives 0, 1, 2 and each value gets 10 added."},
 {q:"How do you add a condition to a dictionary comprehension?",
  o:["A. {x: x*x if x > 2}","B. {x: x*x for x in range(10) if x > 2}","C. {x: x*x where x > 2}","D. {x: x*x when x > 2}"],a:1,e:"The filtering if condition comes after the iterable."},
 {q:"What is the output of: {x: x**2 for x in range(5) if x % 2 == 0}?",
  o:["A. {1: 1, 3: 9}","B. {0: 0, 2: 4, 4: 16}","C. {0: 0, 1: 1, 2: 4, 3: 9, 4: 16}","D. {2: 4, 4: 16}"],a:1,e:"The condition keeps only even numbers, including 0."},
 {q:"What does {x: len(x) for x in ['cat', 'dog']} create?",
  o:["A. {'cat': 3, 'dog': 3}","B. {3: 'cat', 3: 'dog'}","C. ['cat': 3, 'dog': 3]","D. {'cat', 'dog'}"],a:0,e:"Each word is a key and len(x) is its value."},
 {q:"Which keyword is required in a dictionary comprehension?",
  o:["A. for","B. loop","C. repeat","D. iterate"],a:0,e:"The for keyword iterates over the source iterable."},
 {q:"What is the output of: {x: x*2 for x in range(1, 4)}?",
  o:["A. {1: 2, 2: 4, 3: 6}","B. {2: 1, 4: 2, 6: 3}","C. {1, 2, 3, 4, 6}","D. {2, 4, 6}"],a:0,e:"Keys are 1, 2, 3 and values are doubled."},
 {q:"What is a main advantage of dictionary comprehensions?",
  o:["A. They can make dictionary-building code shorter and readable","B. They remove dictionaries","C. They make Python slower","D. They can only store numbers"],a:0,e:"They provide a concise way to construct dictionaries from iterables."}
];

let current=0, score=0, answered=false, userAnswers=[];

const qEl=document.getElementById("question");
const oEl=document.getElementById("options");
const fEl=document.getElementById("feedback");
const next=document.getElementById("nextBtn");

function loadQuestion(){
  answered=false;
  const q=questions[current];
  document.getElementById("questionNumber").textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById("score").textContent=`Score: ${score}`;
  document.getElementById("progressBar").style.width=`${(current/questions.length)*100}%`;
  qEl.textContent=q.q;
  oEl.innerHTML="";
  fEl.textContent="";
  next.style.display="none";
  q.o.forEach((text,i)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=text;
    btn.onclick=()=>selectAnswer(i,btn);
    oEl.appendChild(btn);
  });
}
function selectAnswer(index,clicked){
  if(answered)return;
  answered=true;
  userAnswers[current]=index;
  const q=questions[current];
  document.querySelectorAll(".option").forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.a)btn.classList.add("correct");
  });
  if(index===q.a){
    score++;
    fEl.textContent="✅ Correct! "+q.e;
  }else{
    clicked.classList.add("wrong");
    fEl.textContent="❌ Incorrect. "+q.e;
  }
  document.getElementById("score").textContent=`Score: ${score}`;
  next.style.display="block";
  if(current===questions.length-1)next.textContent="See Results →";
}
next.onclick=()=>{
  if(current<questions.length-1){current++;loadQuestion();}
  else showResults();
};
function showResults(){
  document.getElementById("quizCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");
  const pct=Math.round(score/questions.length*100);
  document.getElementById("finalScore").textContent=`${score}/${questions.length}`;
  document.getElementById("percentage").textContent=`You scored ${pct}%`;
  let msg=pct>=90?"🏆 Excellent! You really understand dictionary comprehensions."
    :pct>=70?"👏 Great job! Keep practicing."
    :pct>=50?"👍 Good start! Review the concepts and try again."
    :"📚 Keep practicing—you'll improve quickly!";
  document.getElementById("finalMessage").textContent=msg;
  const review=document.getElementById("review");
  review.innerHTML="<h3>Answer Review</h3>";
  questions.forEach((q,i)=>{
    const div=document.createElement("div");
    div.className="review-item";
    const ok=userAnswers[i]===q.a;
    div.innerHTML=`${ok?"✅":"❌"} <b>Q${i+1}:</b> ${q.q}<br><span class="small">Correct: ${q.o[q.a]}</span>`;
    review.appendChild(div);
  });
}
function restartQuiz(){
  current=0;score=0;answered=false;userAnswers=[];
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("quizCard").classList.remove("hidden");
  loadQuestion();
}
loadQuestion();
</script>
</body>
</html>
